name: macOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Run Chrome extension fixture tests
        run: node --test Tests/ChromeExtensionTests/*.test.mjs
      - name: Check link clear UI contract
        run: python3 -m unittest discover -s Tests/CaptionGrabUITests -p 'test_*.py' -v
      - name: Run synthetic-fixture tests
        run: swift test
      - name: Build, package, and verify app
        run: bash Scripts/package-app.sh
      - name: Launch smoke test
        run: bash Scripts/smoke-test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: CaptionGrab-macOS-${{ github.run_number }}
          path: |
            dist/CaptionGrab.zip
            dist/CaptionGrab.zip.sha256
          if-no-files-found: error
          retention-days: 30

  capture-readme-media:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/docs/presentation-polish'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Capture the latest CaptionGrab release
        env:
          APP_KEY: captiongrab
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/capture-readme-media.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captiongrab-readme-media
          path: |
            docs/images/captiongrab-light.png
            docs/images/captiongrab-dark.png
            docs/images/captiongrab-hero.gif
            docs/images/social-preview.png
            ${{ runner.temp }}/readme-media/*
          if-no-files-found: warn
          retention-days: 14
