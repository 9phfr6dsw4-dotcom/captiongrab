name: Temporary README screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest released app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/readme-images"
          curl --fail --location --silent --show-error \
            https://github.com/9phfr6dsw4-dotcom/captiongrab/releases/latest/download/CaptionGrab.zip \
            --output "$RUNNER_TEMP/CaptionGrab.zip"
          ditto -x -k "$RUNNER_TEMP/CaptionGrab.zip" "$RUNNER_TEMP/app"
      - name: Capture the app with a sample YouTube link
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readme-images"
          cat > "$RUNNER_TEMP/capture.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let args = CommandLine.arguments
          guard args.count == 2 else { fatalError("owner required") }
          let owner = args[1]
          let ownerKey = kCGWindowOwnerName as String
          let layerKey = kCGWindowLayer as String
          let numberKey = kCGWindowNumber as String
          func normalized(_ value: String) -> String { value.filter(\.isLetter).lowercased() }
          let windows = (CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]]) ?? []
          guard let row = windows.first(where: { ($0[ownerKey] as? String).map(normalized) == normalized(owner) && ($0[layerKey] as? Int ?? 0) == 0 }),
                let number = row[numberKey] as? CGWindowID else {
            fputs("Could not find a visible window for \(owner)\n", stderr); exit(1)
          }
          print(number)
          SWIFT
          APP="$RUNNER_TEMP/app/CaptionGrab.app"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          cat > "$RUNNER_TEMP/seed-history.swift" <<'SWIFT'
          import Foundation
          struct RecentVideo: Codable {
            let videoID: String
            let title: String
            let videoURL: URL
            let lastFetchedAt: Date
          }
          let suite = UserDefaults(suiteName: CommandLine.arguments[1])!
          let video = RecentVideo(videoID: "aircAruvnKk", title: "Neural network basics", videoURL: URL(string: "https://www.youtube.com/watch?v=aircAruvnKk")!, lastFetchedAt: Date())
          suite.set(try JSONEncoder().encode([video]), forKey: "CaptionGrab.recentVideos")
          SWIFT
          swift "$RUNNER_TEMP/seed-history.swift" "$BUNDLE_ID"
          open "$APP"
          sleep 4
          printf 'https://www.youtube.com/watch?v=aircAruvnKk' | pbcopy
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "CaptionGrab"
              set frontmost to true
              delay 1
              keystroke tab
              keystroke "v" using {command down}
            end tell
          end tell
          APPLESCRIPT
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")"
          [[ "$ICON_NAME" == *.icns ]] || ICON_NAME="$ICON_NAME.icns"
          sips -s format png "$APP/Contents/Resources/$ICON_NAME" --out "$RUNNER_TEMP/readme-images/captiongrab-icon.png" >/dev/null
          WINDOW_ID="$(swift "$RUNNER_TEMP/capture.swift" CaptionGrab)"
          screencapture -x -l "$WINDOW_ID" "$RUNNER_TEMP/readme-images/captiongrab-window.png"
      - uses: actions/upload-artifact@v4
        with:
          name: captiongrab-readme-images
          path: ${{ runner.temp }}/readme-images/*.png
          if-no-files-found: error
          retention-days: 7
